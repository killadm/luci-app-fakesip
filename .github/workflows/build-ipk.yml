name: Build IPK

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  IMMORTALWRT_VERSION: 24.10.5
  TARGET: mediatek/filogic
  SDK_FILE: immortalwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  SDK_SHA256: a4e44fd91d867edafb618be4164a4ca0a36336ddfbf4493b3c5ac5cb32a92572

jobs:
  build:
    name: ImmortalWrt 24.10.5 mediatek/filogic
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            flex \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      - name: Download ImmortalWrt SDK
        run: |
          set -euo pipefail
          SDK_URL="https://downloads.immortalwrt.org/releases/${IMMORTALWRT_VERSION}/targets/${TARGET}/${SDK_FILE}"
          curl -fL --retry 5 --retry-delay 5 -o sdk.tar.zst "${SDK_URL}"
          echo "${SDK_SHA256}  sdk.tar.zst" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Add local feed
        working-directory: sdk
        run: |
          set -euo pipefail
          feed_dir="${RUNNER_TEMP:?}/fakesip-feed"
          rm -rf "${feed_dir}"
          mkdir -p "${feed_dir}"
          cp -a "${GITHUB_WORKSPACE}/net" "${GITHUB_WORKSPACE}/luci-app-fakesip" "${feed_dir}/"

          sed -i '/^src-.* fakesip /d' feeds.conf.default
          echo "src-link fakesip ${feed_dir}" >> feeds.conf.default
          awk '$1 ~ /^src-/ { print $2 }' feeds.conf.default | while read -r feed; do
            case "${feed}" in
              ''|*/*|*..*) continue ;;
            esac
            rm -rf "feeds/${feed}" "feeds/${feed}.index"
          done
          ./scripts/feeds update -a
          for pkg in libmnl libnfnetlink libnetfilter-queue luci-base; do
            ./scripts/feeds install "${pkg}" || true
          done
          ./scripts/feeds install -p fakesip fakesip luci-app-fakesip

      - name: Configure packages
        working-directory: sdk
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_PACKAGE_fakesip=m
          CONFIG_PACKAGE_luci-app-fakesip=m
          EOF
          make defconfig

      - name: Build IPK packages
        working-directory: sdk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/build-logs"

          log="${GITHUB_WORKSPACE}/build-logs/build.log"

          echo "::group::make package/fakesip/compile package/luci-app-fakesip/compile"
          if make -j"$(nproc)" package/fakesip/compile package/luci-app-fakesip/compile >"${log}" 2>&1; then
            tail -n 80 "${log}" || true
            echo "::endgroup::"
          else
            rc=$?
            echo "::error::make packages failed; full log is attached as build.log"
            tail -n 300 "${log}" || true
            echo "::endgroup::"
            exit "${rc}"
          fi

      - name: Collect IPK artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find sdk/bin/packages -type f \( \
            -name 'fakesip_*.ipk' -o \
            -name 'luci-app-fakesip_*.ipk' \
          \) -print -exec cp -v {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.ipk' -print -quit)"
          sha256sum artifacts/*.ipk > artifacts/sha256sums.txt

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fakesip-ipk-immortalwrt-24.10.5-mediatek-filogic
          path: artifacts/
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-immortalwrt-24.10.5-mediatek-filogic
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 7
