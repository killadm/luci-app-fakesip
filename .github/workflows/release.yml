name: Release Packages

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      versions:
        description: 'OpenWrt versions, comma separated'
        required: false
        default: '24.10.7,25.12.5'
      targets:
        description: 'OpenWrt targets, comma separated. Empty means default matrix.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the GitHub Release as prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  DEFAULT_VERSIONS: 24.10.7,25.12.5
  DEFAULT_TARGETS: x86/64,mediatek/filogic,ramips/mt7621,ath79/generic,ipq40xx/generic,ipq806x/generic,qualcommax/ipq807x,bcm27xx/bcm2711,rockchip/armv8

jobs:
  prepare:
    name: Prepare release matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          INPUT_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.versions || env.DEFAULT_VERSIONS }}
          INPUT_TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || env.DEFAULT_TARGETS }}
        run: |
          set -euo pipefail
          python3 <<'PY' > matrix.json
          import json
          import os

          def parse_csv(value):
              seen = set()
              items = []
              for raw in value.split(","):
                  item = raw.strip()
                  if item and item not in seen:
                      seen.add(item)
                      items.append(item)
              return items

          versions = parse_csv(os.environ["INPUT_VERSIONS"])
          targets = parse_csv(os.environ["INPUT_TARGETS"])

          if not versions:
              raise SystemExit("No OpenWrt versions configured")
          if not targets:
              raise SystemExit("No OpenWrt targets configured")

          include = []
          for version in versions:
              major = int(version.split(".", 1)[0])
              package_format = "apk" if major >= 25 else "ipk"
              for target in targets:
                  include.append({
                      "version": version,
                      "target": target,
                      "target_slug": target.replace("/", "-"),
                      "package_format": package_format,
                  })

          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          echo "matrix=$(cat matrix.json)" >> "${GITHUB_OUTPUT}"

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="manual-${GITHUB_RUN_NUMBER}"
          fi

          prerelease="false"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            prerelease="${INPUT_PRERELEASE}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "release_name=${release_tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: OpenWrt ${{ matrix.version }} ${{ matrix.target }}
    runs-on: ubuntu-22.04
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            flex \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            tar \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      - name: Download OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
          OPENWRT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          sdk_base_url="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          curl -fL --retry 5 --retry-delay 5 -o sha256sums "${sdk_base_url}/sha256sums"

          sdk_file="$(
            awk '$2 ~ /^\*?openwrt-sdk-.*Linux-x86_64\.tar\.(xz|zst)$/ { sub(/^\*/, "", $2); print $2; exit }' sha256sums
          )"
          if [[ -z "${sdk_file}" ]]; then
            echo "::error::No OpenWrt SDK tarball found in ${sdk_base_url}/sha256sums"
            awk '$2 ~ /sdk/ { print $2 }' sha256sums || true
            exit 1
          fi

          curl -fL --retry 5 --retry-delay 5 -O "${sdk_base_url}/${sdk_file}"
          sha256sum -c --ignore-missing sha256sums

          mkdir sdk
          case "${sdk_file}" in
            *.tar.zst)
              tar --zstd -xf "${sdk_file}" -C sdk --strip-components=1
              ;;
            *.tar.xz)
              tar -Jxf "${sdk_file}" -C sdk --strip-components=1
              ;;
            *)
              echo "::error::Unsupported SDK archive format: ${sdk_file}"
              exit 1
              ;;
          esac

      - name: Add local feed
        working-directory: sdk
        run: |
          set -euo pipefail
          echo "src-link fakesip ${GITHUB_WORKSPACE}" >> feeds.conf.default
          ./scripts/feeds update -a

          for pkg in libmnl libnfnetlink libnetfilter-queue luci-base; do
            ./scripts/feeds install "${pkg}" || true
          done
          ./scripts/feeds install -p fakesip fakesip luci-app-fakesip

      - name: Configure packages
        working-directory: sdk
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_PACKAGE_fakesip=m
          CONFIG_PACKAGE_luci-app-fakesip=m
          EOF
          make defconfig

      - name: Build packages
        working-directory: sdk
        run: |
          set -euo pipefail
          make package/fakesip/compile V=s -j"$(nproc)"
          make package/luci-app-fakesip/compile V=s -j"$(nproc)"
          make package/index V=s

      - name: Collect release assets
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
          OPENWRT_TARGET: ${{ matrix.target }}
          TARGET_SLUG: ${{ matrix.target_slug }}
          PACKAGE_FORMAT: ${{ matrix.package_format }}
        run: |
          set -euo pipefail

          bundle="fakesip-openwrt-${OPENWRT_VERSION}-${TARGET_SLUG}"
          mkdir -p "dist/${bundle}" release-assets

          mapfile -t packages < <(
            find sdk/bin/packages -type f \( \
              -name 'fakesip_*.ipk' -o \
              -name 'luci-app-fakesip_*.ipk' -o \
              -name 'fakesip*.apk' -o \
              -name 'luci-app-fakesip*.apk' \
            \) | sort
          )

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "::error::No fakesip package files were produced"
            find sdk/bin/packages -type f | sort || true
            exit 1
          fi

          for package in "${packages[@]}"; do
            base="$(basename "${package}")"
            cp -v "${package}" "dist/${bundle}/${base}"
            cp -v "${package}" "release-assets/openwrt-${OPENWRT_VERSION}-${TARGET_SLUG}-${base}"
          done

          mapfile -t package_dirs < <(
            printf '%s\n' "${packages[@]}" | xargs -r -n1 dirname | sort -u
          )

          for dir in "${package_dirs[@]}"; do
            while IFS= read -r index_file; do
              relative="${index_file#sdk/bin/packages/}"
              target_path="dist/${bundle}/index/${relative}"
              mkdir -p "$(dirname "${target_path}")"
              cp -v "${index_file}" "${target_path}"
            done < <(
              find "${dir}" -maxdepth 1 -type f \( \
                -name 'Packages' -o \
                -name 'Packages.gz' -o \
                -name 'Packages.manifest' -o \
                -name 'Packages.sig' -o \
                -name 'packages.adb' -o \
                -name 'packages.adb.sig' -o \
                -name 'APKINDEX.tar.gz' \
              \) | sort
            )
          done

          (
            cd "dist/${bundle}"
            tmp_sha="$(mktemp)"
            find . -type f ! -name 'sha256sums.txt' -print0 | sort -z | xargs -0 sha256sum > "${tmp_sha}"
            mv "${tmp_sha}" sha256sums.txt
          )

          tar -C dist -czf "release-assets/${bundle}.tar.gz" "${bundle}"

          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          bundle = f"fakesip-openwrt-{os.environ['OPENWRT_VERSION']}-{os.environ['TARGET_SLUG']}"
          dist_dir = Path("dist") / bundle
          release_dir = Path("release-assets")
          package_format = os.environ["PACKAGE_FORMAT"]

          packages = []
          for path in sorted(dist_dir.glob(f"*.{package_format}")):
              packages.append({
                  "file": path.name,
                  "sha256": sha256(path),
                  "size": path.stat().st_size,
              })

          manifest = {
              "schema": 1,
              "openwrt_version": os.environ["OPENWRT_VERSION"],
              "target": os.environ["OPENWRT_TARGET"],
              "target_slug": os.environ["TARGET_SLUG"],
              "package_format": package_format,
              "bundle": f"{bundle}.tar.gz",
              "packages": packages,
          }

          with (release_dir / f"{bundle}.manifest.json").open("w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          tmp_sha="$(mktemp)"
          find release-assets -type f ! -name 'sha256sums.txt' -print0 | \
            sort -z | \
            xargs -0 sha256sum > "${tmp_sha}"
          mv "${tmp_sha}" "release-assets/${bundle}.sha256sums.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakesip-openwrt-${{ matrix.version }}-${{ matrix.target_slug }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs:
      - prepare
      - build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path("release-assets")
          builds = []
          for manifest_path in sorted(root.glob("*.manifest.json")):
              with manifest_path.open(encoding="utf-8") as handle:
                  builds.append(json.load(handle))

          assets = []
          for path in sorted(root.iterdir()):
              if not path.is_file() or path.name == "manifest.json":
                  continue
              assets.append({
                  "file": path.name,
                  "sha256": sha256(path),
                  "size": path.stat().st_size,
              })

          manifest = {
              "schema": 1,
              "release": os.environ["RELEASE_TAG"],
              "builds": builds,
              "assets": assets,
          }

          with (root / "manifest.json").open("w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          tmp_sha="$(mktemp)"
          find release-assets -type f ! -name 'sha256sums.txt' -print0 | \
            sort -z | \
            xargs -0 sha256sum > "${tmp_sha}"
          mv "${tmp_sha}" release-assets/sha256sums.txt

      - name: Create release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
        run: |
          set -euo pipefail

          python3 <<'PY' > release-notes.md
          import json
          import os
          from pathlib import Path

          with Path("release-assets/manifest.json").open(encoding="utf-8") as handle:
              manifest = json.load(handle)

          versions = sorted({item["openwrt_version"] for item in manifest["builds"]})
          targets = sorted({item["target"] for item in manifest["builds"]})
          formats = sorted({item["package_format"] for item in manifest["builds"]})

          print(f"# {os.environ['RELEASE_NAME']}")
          print()
          print("FakeSIP OpenWrt package release.")
          print()
          print(f"- Versions: {', '.join(versions)}")
          print(f"- Targets: {', '.join(targets)}")
          print(f"- Formats: {', '.join(formats)}")
          print()
          print("Each target bundle contains package files, feed index files, and sha256sums.txt.")
          print("The top-level manifest.json and sha256sums.txt cover all uploaded Release assets.")
          PY

      - name: Upload GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          prerelease_args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_NAME}" --notes-file release-notes.md "${prerelease_args[@]}"
          else
            gh release create "${RELEASE_TAG}" release-assets/* \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --target "${GITHUB_SHA}" \
              "${prerelease_args[@]}"
          fi
